plugins { id 'com.android.application' }
android {
 namespace 'ci.igc.autowash'
 compileSdk 35
 defaultConfig { applicationId 'ci.igc.autowash'; minSdk 26; targetSdk 35; versionCode 2; versionName '0.2.0-test' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { debug { applicationIdSuffix '.test2'; versionNameSuffix '-debug' }; release { minifyEnabled false } }
}
dependencies {
 implementation 'androidx.activity:activity:1.10.1'
 implementation 'androidx.core:core:1.15.0'
 implementation 'androidx.camera:camera-camera2:1.4.2'
 implementation 'androidx.camera:camera-lifecycle:1.4.2'
 implementation 'androidx.camera:camera-view:1.4.2'
 implementation 'androidx.webkit:webkit:1.12.1'
 implementation 'com.google.mlkit:text-recognition:16.0.1'
 testImplementation 'junit:junit:4.13.2'
}
