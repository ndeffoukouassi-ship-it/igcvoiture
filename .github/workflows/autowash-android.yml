name: AutoWash Android - APK de test

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/autowash-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compiler et tester
        working-directory: android
        run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Publier APK de test
        uses: actions/upload-artifact@v4
        with:
          name: IGC-AutoWash-Android-0.2-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
