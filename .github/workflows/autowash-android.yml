name: AutoWash Android - candidat terrain

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/autowash-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer les composants Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compiler et tester
        working-directory: android
        run: gradle :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease --no-daemon
      - name: Publier APK à signer
        uses: actions/upload-artifact@v4
        with:
          name: IGC-AutoWash-1.0.0-rc1-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
